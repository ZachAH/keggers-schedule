# Netlify build + SPA routing config.
# Set the VITE_FIREBASE_* environment variables in the Netlify UI
# (Site settings → Environment variables) — do NOT commit them here.
[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send all routes to index.html so deep links / refreshes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
